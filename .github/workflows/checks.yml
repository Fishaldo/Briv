name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# The checks only read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Postgres, so the server's tests also run against the database live uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: briv
          POSTGRES_DB: briv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      # Actions are pinned to exact commits (the tag is in the comment), so a moved tag cannot change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Known security problems in what live runs
        run: pnpm audit --prod --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Server tests on Postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:briv@localhost:5432/briv_test
        run: pnpm --filter @briv/api test

      - name: Migrations match the schema
        run: |
          pnpm --filter @briv/db generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "The schema changed without a migration. Run pnpm db:generate and commit the result."
            git status --porcelain packages/db/migrations
            exit 1
          fi

      - name: Build the server and the website
        run: pnpm build
